# ReportBot Configuration Example
# Copy this file and replace placeholder values for your environment.
# Environment variables can override any field in this file.

# Slack app tokens
slack_bot_token: "xoxb-your-bot-token"
slack_app_token: "xapp-your-app-token"

# GitLab sources (optional — set any to fetch via /fetch). Each entry is one GitLab endpoint:
#   - group sources (group_id) fetch all MRs in that group
#   - branch sources (project + branch) fetch commits from that branch;
#     each commit becomes a Work Item with Status "done", owned via the author_ids
#     plain name key, with tickets parsed from "<ref_ticket_label>: <id>" in the message
#   Merge/revert commits are skipped; one failing source does not abort the others.
# Tokens may reference environment variables: token: "${MY_GITLAB_TOKEN}"
# Exactly one source must have default: true (the source unqualified gitlab: author_ids
# keys resolve against). Name may contain only lowercase letters, digits, _ and -.
gitlab_sources:
  - name: dops
    url: "https://gitlab.example.com"
    token: "${DOPS_GITLAB_TOKEN}"
    group_id: "my-team-group"
    # MR description field label used to parse ticket IDs (e.g. "Jira:")
    ref_ticket_label: "Jira"
    default: true
  - name: corp
    url: "https://gitlab.corp.example.com"
    token: "${CORP_GITLAB_TOKEN}"
    project: "my-group/my-project"  # project path with slashes
    branch: "main"
    # Commit message label used to parse ticket IDs (e.g. "Jira 1234567: fix")
    ref_ticket_label: "Jira"

# GitHub access (optional — set to fetch PRs via /fetch)
github_token: ""
github_org: "my-github-org"
github_repos: []  # optional: limit to specific repos, e.g. ["org/repo1", "org/repo2"]
# GitHub PR description field label used to parse ticket IDs; empty disables parsing
github_ref_ticket_label: "Jira"

# Decision model (System One protocol). It files every Work Item: it picks the Section and,
# when code cannot decide, the Status, ticket ID and Update, with calibrated probabilities.
decision_model_url: "https://api.compat.example"
decision_model_api_key: ""
decision_model_name: ""
# Section confidence needed to file without asking "Where does this go?"
decision_model_confidence: 0.85
# Similar past Work Items (with their Sections) the decision model sees when filing
similar_item_count: 30

# Optional LLM, used only for Structure Proposals (after publishing and on /retrospect).
# Leave llm_provider empty to run without it. Supported values: anthropic, openai
llm_provider: ""
llm_model: "" # optional; uses provider default when empty
# Reasoning effort for OpenAI-compatible providers (low, medium, high); empty sends none
llm_reasoning_effort: ""
anthropic_api_key: ""
openai_api_key: ""
# Optional base URL for OpenAI-compatible endpoints
openai_base_url: "https://api.openai.com/v1"

# Data and output paths
db_path: "./reportbot.db"
report_output_dir: "./reportbot-reports"
external_http_timeout_seconds: 90
# Skip TLS certificate verification (for internal/corporate CAs)
tls_skip_verify: false

# Channel ID used for report reminders and links
report_channel_id: "C01234567"

# Manager Slack user IDs (controls access to /fetch, /generate-report, /check, /retrospect, /stats)
manager_slack_ids:
  - "U01ABC123"

# Owners of fetched and imported Work Items (who may edit them and receives their DMs).
# Unmapped items are manager-only; names are never matched at run time.
# - Plain keys are report author names, used by the migrate-v2 import and by branch commits
#   (commit author name).
# - "gitlab@<source name>:<numeric id or username>" are GitLab accounts on that source;
#   "gitlab:<numeric id or username>" resolves against the default source only.
# - "github:<numeric id or login>" are GitHub accounts.
# Usernames match exactly, ignoring case; a renamed username must be
# updated here (numeric IDs never change). If both keys match one author, the ID key wins.
# Draft a reviewed starting point with: reportbot migrate-v2 --report <latest.md> --suggest-author-ids
# Env override: AUTHOR_IDS='{"Alice Smith": "U01ALICE00", "gitlab@corp:asmith": "U01ALICE00"}'
author_ids:
  "Alice Smith": "U01ALICE00"
  "gitlab@corp:asmith": "U01ALICE00"  # GitLab account on source "corp", by username
  "gitlab:asmith": "U01ALICE00"       # GitLab account on the default source, by username
  "github:5678": "U01ALICE00"         # by numeric account ID

# Team member full names (as shown in Slack)
team_members:
  - "Alice Smith"
  - "Bob Lee"

# Automatic MR/PR fetching schedule (standard 5-field cron expression)
# Examples: "0 9 * * *" (daily 9am), "0 9 * * 1-5" (weekdays 9am), "0 9 * * 5" (Fridays 9am)
# Leave empty to disable auto-fetch.
auto_fetch_schedule: "0 7,20 * * *"

# Weekly nudge schedule in configured timezone
nudge_day: "Friday"
nudge_time: "10:00"

# If command is run on Monday before this time, use previous week
monday_cutoff_time: "12:00"

# Timezone used by week boundary and scheduler
# Use IANA format, for example: America/Los_Angeles
timezone: "America/Los_Angeles"

# Team name used in report titles and filenames
team_name: "My Team"

# Web UI (optional — set web_enabled: true to serve the report editor at localhost:8080)
web_enabled: false
web_port: 8080
# Slack OAuth credentials for "Sign in with Slack" (from your Slack app settings)
web_client_id: ""
web_client_secret: ""
# Random secret for signing session cookies (generate with: openssl rand -hex 32)
web_session_secret: ""
# Base URL for OAuth redirect (must match the redirect URL in Slack app settings)
web_base_url: "http://localhost:8080"
